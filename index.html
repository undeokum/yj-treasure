<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학여행 보물찾기 대작전</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: 레트로 픽셀 폰트 (DungGeunMo, Press Start 2P) 및 Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&family=Press+Start+2P&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- html5-qrcode Library for Camera Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Canvas Confetti for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDK (실시간 데이터베이스 연동 모듈) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 전역 설정 정보 가져오기
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'school-treasure-hunt';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "demo-key",
                authDomain: "demo.firebaseapp.com",
                projectId: "demo-project",
                storageBucket: "demo.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:demo"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // window 전역 객체에 Firestore 참조 전달
        window.db = db;
        window.appId = appId;
        window.collection = collection;
        window.doc = doc;
        window.setDoc = setDoc;
        window.deleteDoc = deleteDoc;
        window.onSnapshot = onSnapshot;
        window.getDocs = getDocs;
        window.writeBatch = writeBatch;

        // Firebase 사용자 인증 처리
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth init error:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Database connected. User ID:", user.uid);
                if (window.startRealtimeSync) {
                    window.startRealtimeSync();
                }
            } else {
                initAuth();
            }
        });

        initAuth();
    </script>
    
    <style>
        body {
            font-family: 'DungGeunMo', 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* 아케이드 스타일 픽셀 박스 섀도우 & 테두리 */
        .pixel-box {
            border: 4px solid #000000;
            box-shadow: 4px 4px 0px #000000;
        }

        .pixel-box-sm {
            border: 3px solid #000000;
            box-shadow: 3px 3px 0px #000000;
        }

        .pixel-btn {
            border: 3px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s ease;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        .font-pixel-num {
            font-family: 'Press Start 2P', cursive;
        }

        /* 네온 아케이드 그라데이션 */
        .arcade-header-bg {
            background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
            border-bottom: 4px solid #f43f5e;
        }

        #reader video {
            border-radius: 0.5rem;
            object-fit: cover;
        }
    </style>
</head>
<body class="min-h-screen pb-16 bg-slate-950">

    <!-- STEP 2: 메인 앱 컨테이너 (입장 후 노출) -->

        <!-- 교사 관리자 전용 대시보드 -->

            <div class="flex items-center justify-between border-b border-slate-800 pb-3">

                </summary>
                <div class="mt-3 pt-3 border-t border-slate-800 space-y-2">
                    <button onclick="toggleSampleCodesBox()" class="w-full py-1.5 bg-slate-800 text-slate-300 font-bold text-xs pixel-btn">
                        샘플 코드 목록 토글
                    </button>
                    <div id="sampleCodesBox" class="hidden bg-slate-950 p-2.5 font-mono text-[11px] text-slate-300 break-all leading-relaxed border border-slate-800">

    </main>

    <!-- 교사 로그인 모달 -->
    <div id="teacherModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 p-6 max-w-sm w-full space-y-4 pixel-box border-pink-500">
            <div class="text-center">
                <div class="w-12 h-12 bg-pink-500 text-white flex items-center justify-center mx-auto text-xl mb-2 pixel-box">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h3 class="font-bold text-yellow-300 text-base">선생님 인증</h3>
                <p class="text-xs text-slate-400 mt-1">선생님 전용 비밀번호를 입력해주세요.</p>
            </div>

            <div>
                <input type="password" id="teacherPasswordInput" placeholder="비밀번호 입력 (기본: teacher123)" class="w-full text-center py-2.5 px-3 bg-slate-950 border-2 border-slate-700 text-yellow-300 font-bold focus:outline-none focus:border-pink-500 text-sm">
            </div>

            <div class="flex gap-2">
                <button onclick="closeTeacherModal()" class="flex-1 py-2.5 bg-slate-800 text-slate-300 font-bold text-xs pixel-btn">
                    취소
                </button>
                <button onclick="loginTeacher()" class="flex-1 py-2.5 bg-pink-500 text-white font-bold text-xs pixel-btn">
                    확인 및 입장
                </button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        // 상태 변수
        let selectedClass = "2-1";
        let isEntered = false; 
        let isTeacherLoggedIn = false;
        let html5QrCode = null;
        let isScanning = false;
        let unsubscribeSync = null;

        const TEACHER_PASSWORD = "teacher123";

        // 기본 등록 가능 샘플 보물 데이터
        const DEFAULT_TREASURES = {
            "TREASURE01": { points: 100, name: "황금 열쇠" },
            "TREASURE02": { points: 50,  name: "은빛 열쇠" },
            "TREASURE03": { points: 30,  name: "동빛 열쇠" },
            "GOLD777":     { points: 200, name: "전설의 보물상자" },
            "TR2026A":     { points: 50,  name: "비밀의 두루마리" },
            "TR2026B":     { points: 50,  name: "비밀의 두루마리" },
            "LUCKY01":     { points: 80,  name: "행운의 부적" },
            "LUCKY02":     { points: 80,  name: "행운의 부적" },
            "CAMP2026":    { points: 150, name: "수학여행 특별 보물" },
            "STAR99":      { points: 40,  name: "반짝이는 별" }
        };

        let registeredTreasures = {}; 

        window.onload = function() {
            renderWelcomeClassGrid();
            renderLeaderboard();
            generateSampleCodes();
        };

        // Firestore 실시간 자동 동기화 구동
        window.startRealtimeSync = function() {
            if (!window.db || !window.appId) return;

            const publicDataCol = window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'treasures');
            
            if (unsubscribeSync) unsubscribeSync();

            unsubscribeSync = window.onSnapshot(publicDataCol, (snapshot) => {
                const newData = {};
                snapshot.forEach((docSnap) => {
                    newData[docSnap.id] = docSnap.data();
                });
                registeredTreasures = newData;
                renderLeaderboard();
                if (isTeacherLoggedIn) renderAdminTreasureList();

                const syncStatus = document.getElementById('syncStatus');
                if (syncStatus) {
                    syncStatus.innerHTML = `<span class="w-2 h-2 bg-emerald-400 animate-pulse"></span> 실시간 연동 중 (${Object.keys(registeredTreasures).length}개 등록됨)`;
                }
            }, (error) => {
                console.error("Firestore sync error:", error);
                const syncStatus = document.getElementById('syncStatus');
                if (syncStatus) {
                    syncStatus.innerHTML = `<span class="w-2 h-2 bg-rose-500"></span> 오프라인 모드`;
                    syncStatus.className = "inline-flex items-center gap-1.5 text-[11px] font-bold text-rose-400 bg-slate-900 px-3 py-1 pixel-box-sm";
                }
            });
        };

        // DB에 보물 등록 저장
        async function saveTreasureToDB(code, treasureData) {
            if (window.db && window.appId) {
                try {
                    const treasureDoc = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'treasures', code);
                    await window.setDoc(treasureDoc, treasureData);
                } catch (err) {
                    console.error("DB Save error:", err);
                }
            }
        }

        // DB에서 보물 개별 삭제
        async function deleteTreasureFromDB(code) {
            if (window.db && window.appId) {
                try {
                    const treasureDoc = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'treasures', code);
                    await window.deleteDoc(treasureDoc);
                } catch (err) {
                    console.error("DB Delete error:", err);
                }
            }
        }

        // DB 전체 초기화
        async function resetAllDataFromDB() {
            if (window.db && window.appId) {
                try {
                    const publicDataCol = window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'treasures');
                    const snapshot = await window.getDocs(publicDataCol);
                    const batch = window.writeBatch(window.db);
                    snapshot.forEach(docSnap => {
                        batch.delete(docSnap.ref);
                    });
                    await batch.commit();
                } catch (err) {
                    console.error("DB Reset error:", err);
                }
            }
        }

        // STEP 1: 반 선택 버튼 렌더링
        function renderWelcomeClassGrid() {
            const gridContainer = document.getElementById('welcomeClassGrid');
            if (!gridContainer) return;
            gridContainer.innerHTML = '';

            for (let i = 1; i <= 10; i++) {
                const className = `2-${i}`;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `py-2.5 font-bold text-xs pixel-btn ${
                    selectedClass === className 
                        ? 'bg-yellow-400 text-black' 
                        : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`;
                btn.innerText = className;
                btn.onclick = () => selectWelcomeClass(className);
                gridContainer.appendChild(btn);
            }
        }

        function selectWelcomeClass(className) {
            selectedClass = className;
            renderWelcomeClassGrid();
            const label = document.getElementById('enterBtnLabel');
            if (label) label.innerText = `${selectedClass}반으로 입장하기`;
        }

        function enterApp() {
            isEntered = true;
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            document.getElementById('headerClassBadge').classList.remove('hidden');
            
            document.getElementById('selectedClassNameBadge').innerText = `${selectedClass}반`;
            document.getElementById('currentSelectedClassDisplay').innerText = `${selectedClass}반 전용`;
        }

        function openClassSelectModal() {
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('appContent').classList.add('hidden');
        }

        function switchMainTab(tabName) {
            const regTabBtn = document.getElementById('tabRegister');
            const rankTabBtn = document.getElementById('tabRank');
            const secReg = document.getElementById('sectionRegister');
            const secRank = document.getElementById('sectionRank');

            if (tabName === 'register') {
                secReg.classList.remove('hidden');
                secRank.classList.add('hidden');
                regTabBtn.className = "flex-1 py-2.5 text-xs font-bold transition-all bg-cyan-400 text-black pixel-btn flex items-center justify-center gap-2";
                rankTabBtn.className = "flex-1 py-2.5 text-xs font-bold text-slate-400 transition-all flex items-center justify-center gap-2";
            } else {
                secReg.classList.add('hidden');
                secRank.classList.remove('hidden');
                rankTabBtn.className = "flex-1 py-2.5 text-xs font-bold transition-all bg-cyan-400 text-black pixel-btn flex items-center justify-center gap-2";
                regTabBtn.className = "flex-1 py-2.5 text-xs font-bold text-slate-400 transition-all flex items-center justify-center gap-2";
                stopCamera();
            }
        }

        function switchInputMode(mode) {
            const scanArea = document.getElementById('scanArea');
            const manualArea = document.getElementById('manualArea');
            const tabScanBtn = document.getElementById('tabScanBtn');
            const tabManualBtn = document.getElementById('tabManualBtn');

            if (mode === 'scan') {
                scanArea.classList.remove('hidden');
                manualArea.classList.add('hidden');
                tabScanBtn.className = "flex-1 py-1.5 text-xs font-bold bg-cyan-400 text-black";
                tabManualBtn.className = "flex-1 py-1.5 text-xs font-bold text-slate-400";
            } else {
                scanArea.classList.add('hidden');
                manualArea.classList.remove('hidden');
                tabManualBtn.className = "flex-1 py-1.5 text-xs font-bold bg-cyan-400 text-black";
                tabScanBtn.className = "flex-1 py-1.5 text-xs font-bold text-slate-400";
                stopCamera();
            }
        }

        // 보물 코드 등록 검증
        async function processTreasureCode(rawCode) {
            const code = rawCode.trim().toUpperCase();

            if (!code) {
                showMessage("보물 코드를 입력해 주세요.", "warning");
                return;
            }

            if (registeredTreasures[code]) {
                const info = registeredTreasures[code];
                showMessage(`❌ 이미 [${info.class}반]에서 등록한 보물입니다! (${info.time})`, "error");
                return;
            }

            let points = 50;
            let treasureName = "숨겨진 보물";

            if (DEFAULT_TREASURES[code]) {
                points = DEFAULT_TREASURES[code].points;
                treasureName = DEFAULT_TREASURES[code].name;
            } else {
                if (code.length < 4) {
                    showMessage("유효하지 않은 보물 코드 형식입니다.", "warning");
                    return;
                }
            }

            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const newTreasureData = {
                class: selectedClass,
                points: points,
                name: treasureName,
                time: timeStr
            };

            await saveTreasureToDB(code, newTreasureData);

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.7 }
                });
            }

            showMessage(`🎉 성공! [${selectedClass}반] '${treasureName}' (${points}점) 획득!`, "success");
            
            const manualInput = document.getElementById('treasureCodeInput');
            if (manualInput) manualInput.value = '';
        }

        function submitManualCode() {
            const input = document.getElementById('treasureCodeInput');
            if (input) {
                processTreasureCode(input.value);
            }
        }

        function showMessage(text, type) {
            const msgBox = document.getElementById('msgBox');
            const msgIcon = document.getElementById('msgIcon');
            const msgText = document.getElementById('msgText');

            if (!msgBox) return;

            msgBox.classList.remove('hidden', 'bg-emerald-950', 'text-emerald-300', 'border-emerald-500', 'bg-rose-950', 'text-rose-300', 'border-rose-500', 'bg-amber-950', 'text-amber-300', 'border-amber-500', 'bg-slate-800', 'text-slate-300', 'border-slate-600');

            if (type === 'success') {
                msgBox.classList.add('bg-emerald-950', 'text-emerald-300', 'border-emerald-500');
                msgIcon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (type === 'error') {
                msgBox.classList.add('bg-rose-950', 'text-rose-300', 'border-rose-500');
                msgIcon.className = "fa-solid fa-circle-xmark text-rose-400";
            } else if (type === 'warning') {
                msgBox.classList.add('bg-amber-950', 'text-amber-300', 'border-amber-500');
                msgIcon.className = "fa-solid fa-triangle-exclamation text-amber-400";
            } else {
                msgBox.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-600');
                msgIcon.className = "fa-solid fa-circle-info text-cyan-400";
            }

            msgText.innerText = text;
        }

        // 카메라 스캐너 제어
        function toggleCamera() {
            if (isScanning) {
                stopCamera();
            } else {
                startCamera();
            }
        }

        function startCamera() {
            const placeholder = document.getElementById('scannerPlaceholder');
            if (placeholder) placeholder.classList.add('hidden');

            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    processTreasureCode(decodedText);
                    stopCamera();
                },
                (errorMessage) => {}
            ).then(() => {
                isScanning = true;
                document.getElementById('cameraBtnText').innerText = "카메라 끄기";
            }).catch(err => {
                console.error("Camera start error:", err);
                showMessage("카메라를 실행할 수 없습니다. 직접 입력 모드를 이용해주세요.", "error");
                if (placeholder) placeholder.classList.remove('hidden');
            });
        }

        function stopCamera() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    isScanning = false;
                    document.getElementById('cameraBtnText').innerText = "카메라 켜기";
                    const placeholder = document.getElementById('scannerPlaceholder');
                    if (placeholder) placeholder.classList.remove('hidden');
                }).catch(err => console.error(err));
            }
        }

        // 순위표 렌더링
        function renderLeaderboard() {
            const leaderboardList = document.getElementById('leaderboardList');
            if (!leaderboardList) return;

            const stats = {};
            for (let i = 1; i <= 10; i++) {
                stats[`2-${i}`] = { className: `2-${i}반`, score: 0, count: 0 };
            }

            let totalCount = 0;
            Object.values(registeredTreasures).forEach(item => {
                if (stats[item.class]) {
                    stats[item.class].score += (item.points || 0);
                    stats[item.class].count += 1;
                    totalCount += 1;
                }
            });

            const sortedStats = Object.values(stats).sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return b.count - a.count;
            });

            const totalFoundEl = document.getElementById('totalFoundCount');
            if (totalFoundEl) totalFoundEl.innerText = `총 ${totalCount}개 발견됨`;

            leaderboardList.innerHTML = '';
            sortedStats.forEach((item, index) => {
                const rank = index + 1;
                let rankBadge = `<span class="w-6 h-6 bg-slate-800 text-slate-400 font-bold flex items-center justify-center text-xs pixel-box-sm">${rank}</span>`;

                if (rank === 1) {
                    rankBadge = `<span class="w-6 h-6 bg-yellow-400 text-black font-black flex items-center justify-center text-xs pixel-box-sm"><i class="fa-solid fa-crown"></i></span>`;
                } else if (rank === 2) {
                    rankBadge = `<span class="w-6 h-6 bg-slate-300 text-black font-black flex items-center justify-center text-xs pixel-box-sm">2</span>`;
                } else if (rank === 3) {
                    rankBadge = `<span class="w-6 h-6 bg-amber-600 text-white font-black flex items-center justify-center text-xs pixel-box-sm">3</span>`;
                }

                const isMyClass = isEntered && item.className === `${selectedClass}반`;
                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-2.5 pixel-box-sm transition ${
                    isMyClass ? 'bg-indigo-950 border-cyan-400 font-bold' : 'bg-slate-950 border-slate-800'
                }`;

                row.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        ${rankBadge}
                        <div>
                            <span class="text-xs font-bold ${isMyClass ? 'text-cyan-300' : 'text-slate-200'}">${item.className}</span>
                            ${isMyClass ? '<span class="ml-1 text-[10px] bg-pink-500 text-white px-1.5 py-0.5">우리반</span>' : ''}
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-yellow-300">${item.score}점</span>
                        <span class="text-[10px] text-slate-400 block">${item.count}개 발견</span>
                    </div>
                `;
                leaderboardList.appendChild(row);
            });
        }

        // 교사 모달 제어 및 인증
        function openTeacherModal() {
            if (isTeacherLoggedIn) {
                const panel = document.getElementById('teacherPanel');
                if (panel) panel.scrollIntoView({ behavior: 'smooth' });
                return;
            }
            document.getElementById('teacherModal').classList.remove('hidden');
        }

        function closeTeacherModal() {
            document.getElementById('teacherModal').classList.add('hidden');
        }

        function loginTeacher() {
            const pwdInput = document.getElementById('teacherPasswordInput');
            if (pwdInput && pwdInput.value === TEACHER_PASSWORD) {
                isTeacherLoggedIn = true;
                closeTeacherModal();
                document.getElementById('teacherBtnText').innerText = "선생님 모드";
                document.getElementById('teacherPanel').classList.remove('hidden');
                renderAdminTreasureList();
                pwdInput.value = '';
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        }

        function logoutTeacher() {
            isTeacherLoggedIn = false;
            document.getElementById('teacherBtnText').innerText = "선생님";
            document.getElementById('teacherPanel').classList.add('hidden');
        }

        function renderAdminTreasureList() {
            const adminList = document.getElementById('adminTreasureList');
            const adminCount = document.getElementById('adminRegCount');
            if (!adminList) return;

            const keys = Object.keys(registeredTreasures);
            if (adminCount) adminCount.innerText = keys.length;

            if (keys.length === 0) {
                adminList.innerHTML = `<div class="text-center py-4 text-slate-500">등록된 보물이 없습니다.</div>`;
                return;
            }

            adminList.innerHTML = '';
            keys.forEach(code => {
                const item = registeredTreasures[code];
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 bg-slate-900 border border-slate-800";
                div.innerHTML = `
                    <div>
                        <span class="font-mono font-bold text-yellow-300">[${code}]</span>
                        <span class="text-slate-300 ml-1">${item.class}반 - ${item.name} (${item.points}점)</span>
                        <span class="text-slate-500 text-[10px] ml-1">${item.time}</span>
                    </div>
                    <button onclick="deleteSingleTreasure('${code}')" class="text-rose-400 font-bold px-1.5 py-0.5 hover:bg-rose-950">
                        삭제
                    </button>
                `;
                adminList.appendChild(div);
            });
        }

        async function deleteSingleTreasure(code) {
            if (confirm(`'${code}' 보물 등록 건을 삭제하시겠습니까?`)) {
                await deleteTreasureFromDB(code);
                renderLeaderboard();
                renderAdminTreasureList();
            }
        }

        async function confirmResetAll() {
            if (confirm("🚨 경고: 정말로 모든 등록 데이터를 초기화하시겠습니까?")) {
                await resetAllDataFromDB();
                renderLeaderboard();
                renderAdminTreasureList();
                showMessage("선생님 권한으로 모든 데이터가 초기화되었습니다.", "info");
            }
        }

        function generateSampleCodes() {
            const box = document.getElementById('sampleCodesBox');
            if (!box) return;

            let html = `<p class="font-bold text-yellow-300 mb-1">등록 가능한 샘플 보물 코드 목록:</p>`;
            Object.entries(DEFAULT_TREASURES).forEach(([code, data]) => {
                html += `<div>• <span class="font-bold text-cyan-300">${code}</span>: ${data.name} (${data.points}점)</div>`;
            });
            box.innerHTML = html;
        }

        function toggleSampleCodesBox() {
            const box = document.getElementById('sampleCodesBox');
            if (box) {
                box.classList.toggle('hidden');
            }
        }
    </script>
</body>
</html>
